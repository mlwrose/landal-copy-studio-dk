# Structure matters here. Netlify requires the functions directory to sit OUTSIDE
# the publish directory. With publish = "." the functions folder is inside the
# published root, which stops the function deploying and also serves the repo
# source (including the skill) as static files.
#
# So the frontend lives in public/ and nothing else is published.
#
#   public/index.html               served at /
#   netlify/functions/generate.js   served at /.netlify/functions/generate
#
# The build command is a deliberate no-op. Leaving `command` unset is not the same
# as having no build: Netlify falls back to framework detection, finds package.json,
# and runs `npm run build`, which does not exist here.
#
# The skill is inlined into generate.js and synced locally, never at build time:
#   node scripts/sync-skill.js && node scripts/check-rules.js

[build]
  command = "echo 'no build step required'"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
